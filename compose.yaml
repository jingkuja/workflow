name: workflow

x-app-common: &app-common
  build:
    context: .
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - workflow-internal
  volumes:
    - ./data/probes:/data/probes
    - ./data/files:/data/files
  depends_on:
    db-migrate:
      condition: service_completed_successfully
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-mcp-environment: &mcp-environment
  APP_ENV: ${APP_ENV:-development}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://workflow-api:8000}
  PROBE_DATA_DIR: ${PROBE_DATA_DIR:-/data/probes}
  FILE_DATA_DIR: ${FILE_DATA_DIR:-/data/files}
  DATABASE_URL: "sqlite+pysqlite:///:memory:"
  COMPANY_ID: ${COMPANY_ID:-default}
  DISK_REJECT_PERCENT: ${DISK_REJECT_PERCENT:-10}
  MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*}
  MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
  MCP_BOSS_NAME: ${MCP_BOSS_NAME:-老板测试}
  MCP_BOSS_TOKEN: ${MCP_BOSS_TOKEN:-dev-boss-token-change-me}
  MCP_BOSS_WECOM_USERID: ${MCP_BOSS_WECOM_USERID:-}
  MCP_EMPLOYEES_JSON: ${MCP_EMPLOYEES_JSON:-[]}
  MAX_TOPIC_DOCUMENT_BYTES: ${MAX_TOPIC_DOCUMENT_BYTES:-10485760}
  MAX_SCRIPT_DOCUMENT_BYTES: ${MAX_SCRIPT_DOCUMENT_BYTES:-104857600}
  MAX_VIDEO_BYTES: ${MAX_VIDEO_BYTES:-104857600}
  FILE_UPLOAD_TTL_HOURS: ${FILE_UPLOAD_TTL_HOURS:-24}
  T0_ALLOW_WECOM_SEND: ${T0_ALLOW_WECOM_SEND:-false}
  WECOM_GROUP_WEBHOOK_URL: ${WECOM_GROUP_WEBHOOK_URL:-}

services:
  reverse-proxy:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on:
      boss-mcp:
        condition: service_healthy
      employee-mcp:
        condition: service_healthy
      workflow-api:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - workflow-internal
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    # 仅绑定回环地址，供开发机运行真实 PostgreSQL 集成测试（make test-pg）；
    # 不对公网暴露，生产环境可删除该端口映射。
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - workflow-internal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  db-migrate:
    build:
      context: .
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - workflow-internal
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/files:/data/files

  boss-mcp:
    <<: *app-common
    # T4 架构门禁：不继承含 PostgreSQL 密码的 .env，只注入 MCP 所需配置。
    env_file: []
    environment: *mcp-environment
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      workflow-api:
        condition: service_healthy
    command:
      - uvicorn
      - workflow.apps.boss_mcp:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    # 保留业务工具处理文档所需的内存余量；文件内容不再经过 MCP。
    mem_limit: 1g

  employee-mcp:
    <<: *app-common
    # T4 架构门禁：不继承含 PostgreSQL 密码的 .env，只注入 MCP 所需配置。
    env_file: []
    environment: *mcp-environment
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      workflow-api:
        condition: service_healthy
    command:
      - uvicorn
      - workflow.apps.employee_mcp:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    # 员工入口同样需要接收成片，采用与老板入口相同的 T0 上限。
    mem_limit: 1g

  workflow-api:
    <<: *app-common
    command:
      - uvicorn
      - workflow.apps.workflow_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    # workflow-api 接收流式文件上传并执行文档处理，保留 1 GB 内存上限。
    mem_limit: 1g

  workflow-worker:
    <<: *app-common
    command:
      - python
      - -m
      - workflow.apps.worker
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/1/status"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 1536m

networks:
  workflow-internal:
    internal: false

volumes:
  postgres-data:
